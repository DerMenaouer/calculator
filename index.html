<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="all">
    <div id="container">
        <form>
            <input type="text" class="display" value="0">
        </form>
        <div class="jimno" style="font-size:30px ; text-shadow: 3px 5px 10px #ae40f8;"><i><strong>짐노</strong></i></div>
        <div id="bottomPart">   
            <button data-key="103" class="bts btn" id="num" data-num="7">7</button>
            <button data-key="104" class="bts btn" id="num" data-num="8">8</button>
            <button data-key="105" class="bts btn" id="num" data-num="9">9</button>
            <button data-key="111" class="bts btn" id="op" data-num="/">/</button>
            <button data-key="100" class="bts btn" id="num" data-num="4">4</button>
            <button data-key="101" class="bts btn" id="num" data-num="5">5</button>
            <button data-key="102" class="bts btn" id="num" data-num="6">6</button>
            <button data-key="106" class="bts btn" id="op" data-num="*">x</button>
            <button data-key="97" class="bts btn" id="num" data-num="1">1</button>
            <button data-key="98" class="bts btn" id="num" data-num="2">2</button>
            <button data-key="99" class="bts btn" id="num" data-num="3">3</button>
            <button data-key="109" class="bts btn" id="op" data-num="-">-</button>
            <button data-key="96" class="bts btn" id="num" data-num="0">0</button>
            <button data-key="110" class="bts btn" id="dot" data-num=".">.</button>
            <button data-key="13" class="bts btn" id="equal" id="num" data-num="=">=</button>
            <button data-key="107" class="bts btn" id="op" data-num="+">+</button>
            <button data-key="8" class="bts clear" data-num="c">c</button>
        </div>
    </div>
</div>
</body>
</html>
